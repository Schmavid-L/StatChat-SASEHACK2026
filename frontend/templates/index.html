<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="A remotely updated physical display for your in-office status and availability."
  >

  <title>StatChat</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >
</head>

<body>
  <header>
    <h1>Welcome to your StatChat Dashboard! :D</h1>

    <nav>
      <a href="{{ url_for('about') }}">About Us</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Preset Statuses</h2>

      <button
        class="programButton"
        data-msg1="AVAILABLE"
        data-msg2=""
      >
        Available
      </button>

      <br><br>

      <button
        class="programButton"
        data-msg1="IN CLASS"
        data-msg2="PLEASE WAIT"
      >
        In Class
      </button>

      <br><br>

      <button
        class="programButton"
        data-msg1="LUNCH"
        data-msg2="BACK SOON"
      >
        Lunch
      </button>

      <br><br>

      <button
        class="programButton"
        data-msg1="DO NOT DISTURB"
        data-msg2=""
      >
        Do Not Disturb
      </button>
    </section>

    <section>
      <h2>Custom Status</h2>

      <form id="customStatusForm">
        <label for="customLine1">First line:</label>

        <input
          type="text"
          id="customLine1"
          maxlength="16"
          placeholder="Enter first line"
          required
        >

        <br><br>

        <label for="customLine2">Second line:</label>

        <input
          type="text"
          id="customLine2"
          maxlength="16"
          placeholder="Enter second line"
        >

        <br><br>

        <button type="submit">Send Custom Status</button>
      </form>
    </section>

    <p id="result"></p>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
